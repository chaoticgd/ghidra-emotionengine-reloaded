name: Publish unstable builds

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghidra: ["12.2", "12.1.4", "12.1.3", "12.1.2", "12.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Setup Ghidra
        uses: antoniovazquezblanco/setup-ghidra@696333e150699053666b95c5b9a3c159862fde2d
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}
      - name: Download stdump
        run: bash ./os/download.sh
      - name: Build Extension
        run: gradle -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }} buildExtension
      - name: Release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*ghidra-emotionengine-reloaded.zip
          tag: "unstable"
          overwrite: true
          file_glob: true
